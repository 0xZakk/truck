name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Engine navigation
        run: node scripts/check-engine-navigation.mjs
      - name: Cable motion and asynchronous viewer controls
        run: |
          node scripts/check-throttle-cable-motion.mjs
          node scripts/check-throttle-cable-async.mjs
      - name: Python syntax
        run: python -m compileall -q cad scripts tools
      - name: Project status update controls
        run: python scripts/check-engine-project-status.py
      - name: Engine parts inventory coverage and freshness
        run: |
          python scripts/build-engine-work-breakdown.py
          git diff --exit-code -- inventory/engine/work-breakdown.json docs/engine-parts
